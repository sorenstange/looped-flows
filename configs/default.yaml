# Base configuration. Other configs inherit from it with `extends: default.yaml` and override only what differs.
# Any value can also be overridden on the command line, e.g. `oracle.cost=0.001 data.interval=15m`.

data:
  symbol: BTCUSDT
  interval: 5m            # <n>m | <n>h | <n>d | <n>w
  market: futures         # futures (USDT-M perpetuals) | spot
  start: "2019-10-01"     # UTC; skips the placeholder bars right after the BTCUSDT perp listing
  end: null               # UTC, exclusive; null = up to the last closed bar
  cache_dir: data/raw
  update: true            # fetch missing bars from Binance; false = cache only

features:
  lookback: 256           # context bars per sample
  scaling: rolling        # rolling: trailing-window scaling | window: log volume z-scored per sample window
  rolling_window: 2016    # bars of trailing statistics (1 week at 5m); also used by log_vol_to_cost
  clip: 10.0              # clip context features to [-clip, clip]; null = no clipping

oracle:
  horizon: 64             # trajectory length H in bars
  cost: 0.0005            # cost per unit of turnover (Binance USDT-M taker fee)
  num_levels: 21          # allocation levels evenly spaced over [-1, 1] (21 -> steps of 0.1)
  max_step: 0.1           # max position change per bar, incl. the move from a_0; null = unlimited
  return_type: simple     # simple | log
  initial_position: uniform  # a_0 distribution: uniform in [-1, 1] | zero | levels

splits:
  val_start: "2024-01-01"
  test_start: "2025-01-01"
  purge: null             # bars skipped at the start of val/test; null = lookback + horizon
  train_stride: 1

loader:
  batch_size: 256
  num_workers: 0
  seed: 0

backtest:
  split: val              # train | val | test (test only for the final evaluation)
  cost: null              # cost per unit of turnover; null = oracle.cost
  enforce_max_step: false # clip every executed move of every policy to oracle.max_step
  clipped_baselines: true # also run the rule-based baselines with the step limit, as "<name>_clip"
  initial_position: 0.0
  policies: [flat, buy_hold, random, ma_crossover, momentum, oracle]
  seed: 0                 # for the random policy
  baselines:
    ma_fast: 288          # bars in the fast moving average (1 day at 5m)
    ma_slow: 2016         # bars in the slow moving average (1 week at 5m)
    momentum_window: 2016 # bars over which the momentum return is measured (1 week at 5m)

model:                    # denoiser backbone (paper Appendix A / TRM)
  width: 512              # hidden size
  heads: 8
  layers: 2               # transformer blocks in the shared network F
  mlp_width: 1536         # SwiGLU intermediate size
  cycles: 3               # recurrence cycles per denoiser call; only the last one is backpropagated
  inner_steps: 4          # ℓ updates per cycle (m in the paper)
  patch_size: 1           # context bars per context token; lookback must be divisible by it
  rope_base: 10000.0
  norm_eps: 1.0e-5

train:
  method: direct          # direct: one call on an empty trajectory (baseline) | looped_flow: Algorithm 1
  max_steps: 100000
  optimizer: adam_atan2   # adam_atan2 (paper) | adamw
  lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 2000
  lr_schedule: constant   # constant | cosine (decays to min_lr_ratio * lr at max_steps)
  min_lr_ratio: 0.1
  grad_clip: 1.0          # max gradient norm; null = no clipping
  ema_decay: 0.999        # parameter EMA for evaluation and checkpoints; null = no EMA
  loss: stablemax         # stablemax (paper) | softmax
  device: auto            # auto | cpu | cuda
  precision: bf16         # bf16 (autocast on CUDA only) | fp32
  log_every: 100
  eval_every: 2000
  eval_batches: 20        # validation batches, evenly spaced over the val split
  sample_eval_batches: 4  # batches for metrics of sampled trajectories (inference settings); 0 = off
  checkpoint_every: 10000
  overfit_samples: null   # train on the first N train samples with fixed a_0 (sanity check)
  seed: 0

flow:                     # looped-flow training (paper Algorithm 1)
  steps: 16               # k: denoising steps per training rollout (each is one optimizer step)
  time_sampler: sorted    # sorted: k+1 uniform draws, sorted | random_start: t_0 ~ U[0,1], rest ~ U[t_0, 1]
  noise_scale: null       # σ of the noise x_0 ~ N(0, σ² I); null = 1 / sqrt(num_levels)
  share_noise: true       # one noise sample per rollout (paper); false = fresh noise each step (ablation)
  pseudotargets: false    # interpolate towards the previous prediction instead of the target (App. D)
  pseudotarget_ramp_steps: 20000  # pseudotarget probability rises linearly from 0 to 1 over these steps

act:                      # confidence head q (the paper's ACT head)
  tolerance: 0.1          # q target: mean |rounded predicted level - oracle level| <= tolerance
  steps: null             # compare the first m trajectory steps; null = all H
  loss_weight: 0.5        # weight of the BCE loss (paper: 0.5)
  halting: true           # looped flow: a sample stops contributing to later steps once q > 1/2
  exploration_prob: 0.1   # per sample, force a random minimum of 2..k steps before halting (paper: 0.1)

wandb:
  enabled: true           # API key from WANDB_API_KEY (environment or .env); env WANDB_MODE=disabled wins
  project: looped-flows
  entity: null            # null = the key's default entity
  mode: online            # online | offline | disabled
  tags: []

inference:                # how sampled trajectories become the traded allocation
  samples: 16             # K trajectories sampled per decision
  flow_steps: 32          # n: integration steps of the sampler (uniform grid on [0, 1])
  gamma: 5.0              # stochasticity of the sampler; 0 = deterministic Euler integration
  aggregation: mean       # mean over the K samples | best_q (highest confidence score) | q_weighted
  readout: step           # step: expected level at readout_step | prefix_mean: mean over steps 1..readout_step
  readout_step: 1         # 1-based trajectory step; 1 = next bar's planned position

oracle_sweep:             # grid for scripts/sweep_oracle.py (receding-horizon oracle backtests)
  max_steps: [0.1, 0.2, 0.3, 0.5, null]
  horizons: [8, 16, 32, 64, 128]
  costs: [0.0005, 0.001, 0.002]  # oracle planning costs; the backtest charges backtest.cost

output_dir: outputs
